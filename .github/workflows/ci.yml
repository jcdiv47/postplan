# Type-check and test every PR and every push to main.
#
# Railway deploys main only after this passes ("Wait for CI"), so a red run
# here is what keeps a broken commit out of production. Bun comes from
# package.json#packageManager — the same pin Railpack installs (ADR-0005).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
